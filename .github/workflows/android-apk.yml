name: Android VR APK

# Builds the "VR edition" of Dusklight for Quest/Pico: upstream Dusklight plus the additive patch in
# android/patch-dusklight.sh (VR manifest + Dawn shared-texture features). Run it from the Actions
# tab; the APK comes out as an artifact, signed with a throwaway debug key for sideloading.
on:
  workflow_dispatch:
    inputs:
      dusklight_ref:
        description: Dusklight tag or branch to build
        default: v2.0.1
        type: string

env:
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    name: Dusklight VR edition (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod (for the patch script)
        uses: actions/checkout@v7
        with:
          path: mod

      - name: Check out Dusklight
        uses: actions/checkout@v7
        with:
          repository: TwilitRealm/dusklight
          ref: ${{inputs.dusklight_ref}}
          submodules: recursive
          fetch-depth: 0
          path: dusklight

      - name: Apply the VR patch
        run: mod/android/patch-dusklight.sh dusklight

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add aarch64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        working-directory: dusklight
        run: cmake --preset x-android-ci-arm64

      - name: Build native library
        working-directory: dusklight
        run: cmake --build --preset x-android-ci-arm64 --target dusklight

      - name: Build bundled mods
        working-directory: dusklight
        run: cmake --build --preset x-android-ci-arm64 --target dusklight_mods

      - name: Build APK
        working-directory: dusklight/platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Sign the APK for sideloading
        run: |
          set -eux
          unsigned=$(find dusklight/platforms/android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          keytool -genkeypair -keystore sideload.jks -storepass sideload -keypass sideload \
            -alias sideload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dusklight VR sideload, O=dusklight-vr, C=US"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          mkdir -p out
          "$tools/zipalign" -p -f 4 "$unsigned" out/dusklight-vr-edition-arm64.apk
          "$tools/apksigner" sign --ks sideload.jks --ks-pass pass:sideload --key-pass pass:sideload \
            out/dusklight-vr-edition-arm64.apk
          "$tools/apksigner" verify --print-certs out/dusklight-vr-edition-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-vr-edition-arm64
          path: out/*.apk
          if-no-files-found: error
